name: Update routing weekly
on:
  schedule:
    - cron: '23 20 * * 0' # Monday 04:23 Asia/Shanghai
  workflow_dispatch:
    inputs:
      allow_large_change:
        description: 'Allow a reviewed upstream count change over 25%'
        type: boolean
        default: false
  push:
    paths:
      - 'custom.rules'
      - 'build.mjs'
      - '.github/workflows/update.yml'
permissions:
  contents: write
concurrency:
  group: routing-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build and validate (Node 22+ required)
        env:
          ALLOW_LARGE_CHANGE: ${{ inputs.allow_large_change || 'false' }}
        run: node build.mjs
      - name: Commit changed outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add shadowrocket.conf manifest.json rules/ads.list
          if ! git diff --cached --quiet; then
            git commit -m 'Update routing rules'
            git push
          fi
